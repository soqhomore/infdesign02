<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>휴식의 가치</title>
    <link rel="stylesheet" href="/src/pool.css" />
  </head>
  <body>
    <!-- 물 (WebGL, 개복치도 여기서 그림) -->
    <canvas id="pool"></canvas>
    <!-- 이름표·말풍선 -->
    <div class="tank" id="tank"></div>

    <!-- 위: 접속 시간 | 지금 시각 | 내 이름 -->
    <div class="hud">
      <div class="topbar">
        <div class="pill uptime" id="hud-uptime" title="접속한 지 지난 시간">00:00</div>
        <div class="pill name" id="hud-name">개복치이름</div>
        <div class="clock"><p id="hud-ampm">AM</p><p id="hud-time">10:00</p></div>
      </div>
    </div>

    <!-- 게임 제안 배너 (10초) -->
    <div class="card game-banner hidden" id="game-banner">
      <div class="game-banner-row">
        <div>
          <strong id="game-banner-text"></strong>
          <small id="game-banner-sub"></small>
        </div>
        <button type="button" class="light" id="game-join">참여</button>
        <span class="game-joined hidden" id="game-joined">참여함 ✓</span>
      </div>
      <div class="game-banner-track"><div class="game-banner-bar" id="game-banner-bar"></div></div>
    </div>

    <!-- 시야를 넓히자 (김 서린 창 닦기): 관람실 + 김 -->
    <section class="wipe-stage hidden" id="wipe-stage">
      <canvas class="wipe-scene" id="wipe-scene"></canvas>
      <canvas class="wipe-fog" id="wipe-fog"></canvas>
    </section>

    <!-- 같이 쉬기 진행 상황 (아무것도 하지 않기 대결 / 시야를 넓히자) -->
    <div class="card zone-hud hidden" id="zone-hud">
      <div class="zone-hud-top">
        <strong id="zone-hud-title">아무것도 하지 않기 대결하자</strong>
        <span class="zone-hud-time" id="zone-hud-time">0:00</span>
        <span id="zone-hud-count"></span>
      </div>
      <small id="zone-hud-msg"></small>
    </div>

    <!-- 게임 결과 -->
    <div class="game-result hidden" id="game-result"><strong id="game-result-text"></strong></div>

    <!-- 아무것도 하지 않기 대결 순위 -->
    <section class="card game-rank hidden" id="game-rank" aria-label="아무것도 하지 않기 대결 순위">
      <p class="rank-label">아무것도 하지 않기 대결 순위</p>
      <h2 id="game-rank-title"></h2>
      <ol id="game-rank-list"></ol>
      <button type="button" class="light" id="game-rank-close">닫기</button>
    </section>

    <!-- 게임 고르기 -->
    <div class="card game-picker hidden" id="game-picker">
      <p>뭐 하면서 쉴래요?</p>
      <small class="picker-hint">능동적인 휴식은 휴식의 질을 높여요.</small>
      <button type="button" class="outline" data-game="zone">아무것도 하지 않기 대결하자</button>
      <button type="button" class="outline" data-game="wipe">시야를 넓히자</button>
      <button type="button" class="ghost" id="game-picker-cancel">취소</button>
    </div>

    <!-- 아래: 채팅 -->
    <form class="chat hidden" id="chat-form" autocomplete="off">
      <input id="chat-input" type="text" maxlength="60" placeholder="개복치에게 말 시키기" />
      <button type="submit">보내기</button>
      <button type="button" class="game-btn" id="game-btn"><i></i>같이 쉬자</button>
    </form>

    <!-- 상태 안내 -->
    <div class="status hidden" id="status"></div>

    <!-- 입장 -->
    <section class="enter" id="enter">
      <form class="enter-card" id="enter-form" autocomplete="off">
        <h1>휴식의 가치</h1>
        <p>개복치들과 같이 대화하며 쉬고, 좋은 휴식을 생각해봐요</p>
        <input id="name-input" type="text" maxlength="12" placeholder="이름 (최대 12자)" required />
        <button type="submit" class="light">입장하기</button>
      </form>
    </section>

    <!-- 좌상단: 휴식 밸런스 투표 (작은 아이콘 + 미니 팝업) -->
    <button type="button" class="balance-btn hidden" id="balance-btn" aria-label="휴식 밸런스 투표" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v18M7 21h10M5 7h14" />
        <path d="M5 7l-3 6a3 3 0 0 0 6 0z" />
        <path d="M19 7l-3 6a3 3 0 0 0 6 0z" />
      </svg>
    </button>
    <div class="balance-pop hidden" id="balance-pop" role="dialog" aria-label="휴식 밸런스 투표">
      <div class="balance-head">
        <span id="balance-category"></span>
        <span id="balance-left"></span>
      </div>
      <button type="button" class="balance-choice" id="balance-a"></button>
      <button type="button" class="balance-choice" id="balance-b"></button>
      <div class="balance-result hidden" id="balance-result">
        <div class="balance-track"><div class="balance-bar" id="balance-bar"></div></div>
        <small id="balance-count"></small>
      </div>
      <small class="balance-note hidden" id="balance-note"></small>
      <button type="button" class="balance-more" id="balance-more">더보기</button>
      <div class="balance-more-text hidden" id="balance-more-text">
        <p id="balance-summary"></p>
        <p>포스터 속 실제 하루에서 가장 좋았던 휴식은 가장 비싼 곳이 아니라, 넓은 풍경을 보며 직접 고른 시간이었다.</p>
      </div>
    </div>

    <!-- 우상단 설정 -->
    <button type="button" class="settings-btn" id="settings-btn" aria-label="설정" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
    <div class="settings hidden" id="settings" role="dialog" aria-label="설정">
      <section>
        <h2>닉네임</h2>
        <form class="name-row" id="name-form" autocomplete="off">
          <input id="nick-input" type="text" maxlength="12" placeholder="이름 (최대 12자)" />
          <button type="submit" class="light">바꾸기</button>
        </form>
      </section>
      <section>
        <h2>개복치 색</h2>
        <div class="swatches" id="swatches"></div>
      </section>
      <section>
        <h2>밤 모드</h2>
        <div class="segmented" id="theme-mode" role="radiogroup" aria-label="밤 모드">
          <button type="button" role="radio" data-mode="auto">자동</button>
          <button type="button" role="radio" data-mode="day">낮</button>
          <button type="button" role="radio" data-mode="night">밤</button>
        </div>
        <small class="hint">자동: 오후(12시~)에는 밤</small>
      </section>
      <section>
        <h2>물</h2>
        <div class="water-grid">
          <label for="px">도트 크기</label><input id="px" type="range" min="2" max="10" value="2" />
          <label for="speed">속도</label><input id="speed" type="range" min="0" max="2" step="0.1" value="0.5" />
          <label for="dither">디더링</label><input id="dither" type="range" min="0" max="1.5" step="0.1" value="0.6" />
          <label for="pal">팔레트 고정</label><input id="pal" type="checkbox" checked />
          <label for="light">빛 = 마우스</label><input id="light" type="checkbox" checked />
          <span>fps</span><span id="fps">-</span>
        </div>
      </section>
    </div>

    <script type="module" src="/src/pool-main.js"></script>
  </body>
</html>
