<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도트 수조 테스트</title>
    <style>
      @font-face {
        font-family: 'EF_cucumbersalad';
        src: url('/fonts/EF_cucumbersalad.ttf') format('truetype');
        font-display: swap;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #021d55; }
      #pool {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }
      .panel {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(2, 20, 60, 0.6);
        color: #cfeeff;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 10px;
        align-items: center;
        user-select: none;
      }
      .panel.hidden > :not(.toggle) { display: none; }
      .panel input[type='range'] { width: 110px; }
      .toggle { grid-column: 1 / -1; cursor: pointer; opacity: 0.8; }

      /* ---------- HUD (Figma: 쉰다,안쉰다 선택지예시 90:63) ---------- */
      .hud {
        position: fixed;
        top: 24px;
        left: 0;
        right: 0;
        height: 88px;
        pointer-events: none;
        font-family: 'EF_cucumbersalad', sans-serif;
        font-weight: 400;
        line-height: normal;
        color: #fff;
        text-align: center;
        white-space: nowrap;
      }

      /* 가운데 위 시계 캡슐 */
      .topbar {
        position: absolute;
        left: 50%;
        top: 0;
        width: 392px;
        height: 88px;
        transform: translateX(-50%);
      }
      .pill {
        position: absolute;
        top: 26px;
        width: 115px;
        height: 44px;
        box-sizing: border-box;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font-size: 20px;
        overflow: hidden;
      }
      .pill.uptime { left: 0; border-radius: 20px 0 0 20px; letter-spacing: -0.5px; }
      .pill.name { left: 277px; border-radius: 0 20px 20px 0; }
      .clock {
        position: absolute;
        left: calc(50% - 1.5px);
        top: 50%;
        width: 185px;
        height: 88px;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 40px;
        background: #000;
        font-size: 32px;
        letter-spacing: -1.6px;
        overflow: hidden;
      }
      .clock p { margin: 0; }

      /* ---------- 채팅 (시계 캡슐과 같은 검은 알약 스타일) ---------- */
      .chat {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        width: min(480px, calc(100% - 32px));
        display: flex;
        gap: 8px;
        font-family: 'EF_cucumbersalad', sans-serif;
      }
      .chat input, .chat button {
        height: 44px;
        box-sizing: border-box;
        border: none;
        outline: none;
        background: #000;
        color: #fff;
        font: inherit;
        font-size: 20px;
      }
      .chat input {
        flex: 1;
        min-width: 0;
        padding: 0 20px;
        border-radius: 20px 0 0 20px;
      }
      .chat input::placeholder { color: rgba(255, 255, 255, 0.45); }
      .chat input:focus { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35); }
      .chat button {
        width: 115px;
        border-radius: 0 20px 20px 0;
        cursor: pointer;
      }
      .chat button:hover { background: #222; }

      /* 개복치 위 말풍선 */
      .bubble {
        position: fixed;
        left: 0;
        top: 0;
        max-width: 260px;
        width: max-content;
        padding: 10px 16px;
        border-radius: 20px;
        background: #000;
        color: #fff;
        font-family: 'EF_cucumbersalad', sans-serif;
        font-size: 20px;
        line-height: 1.2;
        text-align: center;
        word-break: break-word;
        pointer-events: none;
        transform: translate(-50%, -100%);
        transition: opacity 0.3s;
      }
      .bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 100%;
        border: 8px solid transparent;
        border-top-color: #000;
        transform: translateX(-50%);
      }
      .bubble.hidden { opacity: 0; }

      /* 좁은 화면 */
      @media (max-width: 760px) {
        .hud { transform: scale(0.8); transform-origin: top center; }
        .panel { bottom: 80px; }
      }
    </style>
  </head>
  <body>
    <canvas id="pool"></canvas>

    <!-- HUD -->
    <div class="hud">
      <div class="topbar">
        <div class="pill uptime" id="hud-uptime" title="접속한 지 지난 시간">00:00</div>
        <div class="pill name" id="hud-name">개복치이름</div>
        <div class="clock"><p id="hud-ampm">AM</p><p id="hud-time">10:00</p></div>
      </div>
    </div>
    <!-- 채팅 -->
    <div class="bubble hidden" id="bubble"></div>
    <form class="chat" id="chat" autocomplete="off">
      <input id="chat-input" type="text" maxlength="40" placeholder="개복치에게 말 걸기" />
      <button type="submit">보내기</button>
    </form>

    <div class="panel" id="panel">
      <span class="toggle" id="toggle">▾ 설정 (H)</span>
      <label for="px">도트 크기</label><input id="px" type="range" min="2" max="10" value="2" />
      <label for="speed">속도</label><input id="speed" type="range" min="0" max="2" step="0.1" value="0.5" />
      <label for="dither">디더링</label><input id="dither" type="range" min="0" max="1.5" step="0.1" value="0.6" />
      <label for="pal">팔레트 고정</label><input id="pal" type="checkbox" checked />
      <label for="light">빛 = 마우스</label><input id="light" type="checkbox" checked />
      <span>fps</span><span id="fps">-</span>
    </div>
    <script type="module" src="/src/pool.js"></script>
  </body>
</html>
