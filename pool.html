<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도트 수조 테스트</title>
    <style>
      @font-face {
        font-family: 'EF_cucumbersalad';
        src: url('/fonts/EF_cucumbersalad.ttf') format('truetype');
        font-display: swap;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #021d55; }
      #pool {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }
      .panel {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(2, 20, 60, 0.6);
        color: #cfeeff;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 10px;
        align-items: center;
        user-select: none;
      }
      .panel.hidden > :not(.toggle) { display: none; }
      .panel input[type='range'] { width: 110px; }
      .toggle { grid-column: 1 / -1; cursor: pointer; opacity: 0.8; }

      /* ---------- HUD (Figma: 쉰다,안쉰다 선택지예시 90:63) ---------- */
      .hud {
        position: fixed;
        top: 24px;
        left: 0;
        right: 0;
        height: 88px;
        pointer-events: none;
        font-family: 'EF_cucumbersalad', sans-serif;
        font-weight: 400;
        line-height: normal;
        color: #fff;
        text-align: center;
        white-space: nowrap;
      }

      /* 왼쪽 위 프로필 카드 */
      .profile {
        position: absolute;
        left: 41px;
        top: 0;
        width: 212px;
        height: 88px;
        box-sizing: border-box;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 90px;
        background: #fff;
        overflow: hidden;
      }
      .profile-photo {
        position: relative;
        flex: none;
        width: 82px;
        height: 82px;
        border-radius: 80px;
        overflow: hidden;
        transform: scaleX(-1); /* 디자인에서 좌우 반전 */
      }
      .profile-photo img {
        position: absolute;
        top: 0;
        left: -17.75%;
        width: 117.17%;
        height: 100%;
        max-width: none;
      }
      .stats {
        flex: none;
        width: 87px;
        height: 84px;
        box-sizing: border-box;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        color: #000;
        font-size: 12px;
        text-align: left;
      }
      .stats p { margin: 0; }
      .stat-bar { position: relative; width: 67px; height: 1px; }
      /* SVG는 둥근 끝(선 두께 10) 때문에 칸보다 사방으로 5px 크다 → 원래 크기 그대로 겹쳐 놓기 */
      .stat-bar img { position: absolute; left: -5px; top: -5px; display: block; }
      .stat-bar.tilt { height: 2px; transform: rotate(-0.86deg) skewX(-0.55deg); }

      /* 가운데 위 시계 캡슐 */
      .topbar {
        position: absolute;
        left: 50%;
        top: 0;
        width: 392px;
        height: 88px;
        transform: translateX(-50%);
      }
      .pill {
        position: absolute;
        top: 26px;
        width: 115px;
        height: 44px;
        box-sizing: border-box;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font-size: 20px;
        overflow: hidden;
      }
      .pill.money { left: 0; border-radius: 20px 0 0 20px; }
      .pill.name { left: 277px; border-radius: 0 20px 20px 0; }
      .clock {
        position: absolute;
        left: calc(50% - 1.5px);
        top: 50%;
        width: 185px;
        height: 88px;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 40px;
        background: #000;
        font-size: 32px;
        letter-spacing: -1.6px;
        overflow: hidden;
      }
      .clock p { margin: 0; }

      /* 좁은 화면: 시계를 가운데 두고 프로필은 그 아래로 */
      @media (max-width: 760px) {
        .hud { transform: scale(0.8); transform-origin: top center; }
        .profile { left: 50%; top: 100px; transform: translateX(-50%); }
      }
    </style>
  </head>
  <body>
    <canvas id="pool"></canvas>

    <!-- HUD -->
    <div class="hud">
      <div class="profile">
        <div class="profile-photo"><img src="/ui/profile.png" alt="" /></div>
        <div class="stats">
          <p>여행 의지</p>
          <div class="stat-bar"><img src="/ui/bar-will.svg" alt="여행 의지 77%" /></div>
          <p>발바닥 통증</p>
          <div class="stat-bar tilt"><img src="/ui/bar-pain.svg" alt="발바닥 통증 100%" /></div>
        </div>
      </div>
      <div class="topbar">
        <div class="pill money" id="hud-money">₩1000</div>
        <div class="pill name" id="hud-name">개복치이름</div>
        <div class="clock"><p id="hud-ampm">AM</p><p id="hud-time">10:00</p></div>
      </div>
    </div>
    <div class="panel" id="panel">
      <span class="toggle" id="toggle">▾ 설정 (H)</span>
      <label for="px">도트 크기</label><input id="px" type="range" min="2" max="10" value="2" />
      <label for="speed">속도</label><input id="speed" type="range" min="0" max="2" step="0.1" value="0.5" />
      <label for="dither">디더링</label><input id="dither" type="range" min="0" max="1.5" step="0.1" value="0.6" />
      <label for="pal">팔레트 고정</label><input id="pal" type="checkbox" checked />
      <label for="light">빛 = 마우스</label><input id="light" type="checkbox" checked />
      <span>fps</span><span id="fps">-</span>
    </div>
    <script type="module" src="/src/pool.js"></script>
  </body>
</html>
