<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도트 수조 테스트</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #021d55; }
      #pool {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }
      .panel {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(2, 20, 60, 0.6);
        color: #cfeeff;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 10px;
        align-items: center;
        user-select: none;
      }
      .panel.hidden > :not(.toggle) { display: none; }
      .panel input[type='range'] { width: 110px; }
      .toggle { grid-column: 1 / -1; cursor: pointer; opacity: 0.8; }
    </style>
  </head>
  <body>
    <canvas id="pool"></canvas>
    <div class="panel" id="panel">
      <span class="toggle" id="toggle">▾ 설정 (H)</span>
      <label for="px">도트 크기</label><input id="px" type="range" min="2" max="10" value="4" />
      <label for="speed">속도</label><input id="speed" type="range" min="0" max="2" step="0.1" value="1" />
      <label for="dither">디더링</label><input id="dither" type="range" min="0" max="1.5" step="0.1" value="0.8" />
      <label for="pal">팔레트 고정</label><input id="pal" type="checkbox" checked />
      <label for="light">빛 = 마우스</label><input id="light" type="checkbox" checked />
      <span>fps</span><span id="fps">-</span>
    </div>
    <script type="module" src="/src/pool.js"></script>
  </body>
</html>
